apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulletin-board-deployment
  namespace: bulletin-board-prod
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: bulletin-board
  template:
    metadata:
      labels:
        app: bulletin-board
    spec:
      containers:
      - name: bulletin-board
        image: 123c/hexlet:latest
        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9090
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9090
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        envFrom:
          - configMapRef:
              name: app-config
          - secretRef:
              name: app-secret
