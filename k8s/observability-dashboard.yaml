apiVersion: v1
kind: ConfigMap
metadata:
  name: bulletin-board-observability-dashboard
  namespace: prometheus-operator-space
  labels:
    grafana_dashboard: "1"
data:
  bulletin-board-observability.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum(rate(http_server_requests_seconds_count{job=\"bulletin-board-metrics\"}[5m]))", "legendFormat": "requests/s", "refId": "A"}],
          "title": "Request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "sum(rate(http_server_requests_seconds_sum{job=\"bulletin-board-metrics\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job=\"bulletin-board-metrics\"}[5m])), 0.000001)", "legendFormat": "average latency", "refId": "A"}],
          "title": "Average HTTP latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "targets": [{"expr": "sum(increase(http_server_requests_seconds_count{job=\"bulletin-board-metrics\",status=~\"5..\"}[5m]))", "legendFormat": "5xx / 5m", "refId": "A"}],
          "title": "HTTP 5xx responses",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"bulletin-board-prod\",pod=~\"bulletin-board-deployment-.*\"}[10m]))", "legendFormat": "restarts / 10m", "refId": "A"}],
          "title": "Pod restarts",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 5,
          "targets": [{"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"bulletin-board-prod\",pod=~\"bulletin-board-deployment-.*\",container=\"bulletin-board\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A"}],
          "title": "Application CPU",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 6,
          "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"bulletin-board-prod\",pod=~\"bulletin-board-deployment-.*\",container=\"bulletin-board\"})", "legendFormat": "{{pod}}", "refId": "A"}],
          "title": "Application memory",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": ["bulletin-board", "kubernetes", "observability"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Bulletin Board Observability",
      "uid": "bulletin-board-observability",
      "version": 1
    }
